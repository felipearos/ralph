name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its old run. A push to main does
  # not: each merge needs its own result, or a red main cannot be traced to
  # the merge that caused it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # GitHub-hosted: the repository is public, so the minutes are free, and a
    # pull request from a fork must never run on the host of the live loops
    # (the self-hosted runner there serves only the private archive).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Actions are pinned to a commit, not a tag: a green run is what lets a
    # loop merge unattended, so what runs here must not change when a tag
    # moves upstream. The comment names the release; bump both together.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this job pushes; keep the token out of .git/config.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x

      # The Codex stages confine filesystem reads with bubblewrap, and the tests
      # exercise that sandbox for real. Ubuntu's runners ship without it and
      # restrict the unprivileged user namespaces `bwrap --unshare-user` needs.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
