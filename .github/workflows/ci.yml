name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted: the repository is public, so the minutes are free, and a
    # pull request from a fork must never run on the host of the live loops
    # (the self-hosted runner there serves only the private archive).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # The Codex stages confine filesystem reads with bubblewrap, and the tests
      # exercise that sandbox for real. Ubuntu's runners ship without it and
      # restrict the unprivileged user namespaces `bwrap --unshare-user` needs.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
